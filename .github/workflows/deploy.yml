name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: 45.132.157.152
      HOSTINGER_PORT: 65002
      HOSTINGER_USER: u750146381
      HOSTINGER_ACCOUNT: u750146381
      HOSTINGER_VHOST: theracorp.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create deployment zip
        run: |
          zip -r theracorp-website.zip . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude ".next/*" \
            --exclude ".claude/*" \
            --exclude ".augment/*" \
            --exclude ".continue/*" \
            --exclude ".qwen/*" \
            --exclude ".playwright-mcp/*" \
            --exclude "checkout-success.png"
          echo "Zip size: $(du -sh theracorp-website.zip)"

      - name: Upload zip via SFTP
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$HOSTINGER_PASSWORD" sftp \
            -o StrictHostKeyChecking=no \
            -P "$HOSTINGER_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" <<EOF
          put theracorp-website.zip theracorp-website.zip
          bye
          EOF
          echo "✅ Upload complete"
        env:
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}

      - name: Trigger Hostinger build via hPanel API
        run: |
          # Login to hPanel
          curl -s -c /tmp/cookies.txt -X POST \
            "https://hpanel.hostinger.com/api/auth/login" \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Origin: https://hpanel.hostinger.com' \
            -H 'Referer: https://hpanel.hostinger.com/' \
            -d "{\"email\":\"${HOSTINGER_EMAIL}\",\"password\":\"${HOSTINGER_PASSWORD}\"}" \
            -L --max-redirs 5 -o /tmp/login.json

          # Trigger build
          BUILD_RESP=$(curl -s -b /tmp/cookies.txt \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: XMLHttpRequest' \
            "https://hpanel.hostinger.com/api/wh-api/api/hapi/v1/accounts/${HOSTINGER_ACCOUNT}/vhosts/${HOSTINGER_VHOST}/nodejs/builds" \
            -d '{
              "options": {
                "nodeVersion": 22,
                "appType": "next",
                "rootDirectory": "website",
                "outputDirectory": ".next",
                "buildScript": "build",
                "packageManager": "npm",
                "sourceType": "archive",
                "sourceOptions": {
                  "archivePath": "theracorp-website.zip"
                }
              }
            }')

          echo "Build response: $BUILD_RESP"

          BUILD_ID=$(echo "$BUILD_RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('data', {}).get('uuid', ''))
          " 2>/dev/null)

          if [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger build — check hPanel login"
            exit 1
          fi

          echo "✅ Build triggered: $BUILD_ID"
          echo "Monitor: https://hpanel.hostinger.com/websites/${HOSTINGER_VHOST}/deployments"
        env:
          HOSTINGER_EMAIL: ${{ secrets.HOSTINGER_EMAIL }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
