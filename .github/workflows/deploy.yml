name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: 45.132.157.152
      HOSTINGER_PORT: 65002
      HOSTINGER_USER: u750146381
      HOSTINGER_ACCOUNT: u750146381
      HOSTINGER_VHOST: theracorp.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create deployment zip
        run: |
          zip -r theracorp-website.zip . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude ".next/*" \
            --exclude ".claude/*" \
            --exclude ".augment/*" \
            --exclude ".continue/*" \
            --exclude ".qwen/*" \
            --exclude ".playwright-mcp/*" \
            --exclude "checkout-success.png"
          echo "Zip size: $(du -sh theracorp-website.zip)"

      - name: Upload zip via SCP
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASS" scp \
            -P "$HOSTINGER_PORT" \
            -o StrictHostKeyChecking=no \
            theracorp-website.zip \
            "$HOSTINGER_USER@$HOSTINGER_HOST:theracorp-website.zip"
          echo "✅ Upload complete"

      - name: Extract and build on server
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" ssh \
            -p "$HOSTINGER_PORT" \
            -o StrictHostKeyChecking=no \
            "$HOSTINGER_USER@$HOSTINGER_HOST" bash << 'ENDSSH'
          set -e
          APP_DIR=~/domains/theracorp.org/public_html
          mkdir -p "$APP_DIR"
          cd ~
          unzip -o theracorp-website.zip -d theracorp-website-extracted
          cp -r theracorp-website-extracted/. "$APP_DIR/"
          rm -rf theracorp-website.zip theracorp-website-extracted
          cd "$APP_DIR"
          npm ci --omit=dev
          npm run build
          echo "✅ Build complete"
          ENDSSH
